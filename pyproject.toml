[project]
name = "gitgrit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0",
    "django>=6.0.1",
    "django-allauth[socialaccount]>=65.14.3",
    "django-htmx>=1.27.0",
    "djangorestframework>=3.16.1",
    "docker>=7.0",
    "gunicorn>=23.0",
    "psycopg2-binary>=2.9.11",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.1",
    "whitenoise>=6.0",
    "uvicorn>=0.30",
    "procrastinate[django]>=3.8.1",
    # Pinned: litellm 1.89+ lazily imports litellm.responses.mcp -> litellm.proxy
    # -> fastapi during completion(), which isn't a runtime dep here, so the
    # in-process dependency-inference agent crashes with
    # "ModuleNotFoundError: No module named 'fastapi'". 1.88.1 is the version
    # validated on staging. Also pinned in sandbox_image/Dockerfile, which still
    # installs with plain pip and has no lockfile of its own.
    "litellm==1.88.1",
    "pyjwt>=2.11.0",
    "drf-spectacular>=0.28",
    "django-oauth-toolkit>=3.0",
    # Inlines the shared email stylesheet into each HTML email at send time
    # (app/infrastructure/mailer.py). Pinned: the Dockerfile installs from
    # pyproject, not uv.lock, so a floating range would drift on rebuild.
    "css-inline==0.21.3",
    # Email through the SES API with the host's AWS role (GITGRIT_EMAIL_BACKEND=ses):
    # no SMTP credentials to store. Pinned for the same reason as above.
    "django-ses==4.8.0",
    # Upload projects' archives in S3 (GITGRIT_UPLOADS_BUCKET) with the host's
    # AWS role, like SES above. Pinned for the same reason.
    "django-storages[s3]==1.14.6",
]

[dependency-groups]
dev = [
    "model-bakery>=1.20",
    "poethepoet>=0.34",
    "pytest>=8.0",
    "pytest-django>=4.9",
    "testcontainers[postgres]>=4.9",
]

[tool.poe.tasks]
sandbox = { cmd = "docker build -t gitgrit-sandbox:latest sandbox_image/", help = "Build the sandbox Docker image" }
dev = { cmd = "python manage.py runserver", help = "Run the development server" }
test = { cmd = "python manage.py test", help = "Run tests" }
migrate = { cmd = "python manage.py migrate --noinput", help = "Apply database migrations" }
makemigrations = { cmd = "python manage.py makemigrations", help = "Create new migrations" }
seed = { cmd = "python manage.py seed_marketplace", help = "Seed marketplace standards and packs" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "gitgrit.settings_test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short"
