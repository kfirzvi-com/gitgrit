      description: 'Without `branch`: the project''s health — its default branch''s
        newest commit (`commit_score`), whatever its outcome, and the results of that
        commit''s newest run. With `branch`: that branch''s. A commit reads its newest
        run alone, and its `outcome` is decided in order: `checking` while a standard
        is running; `no_score` when an expected standard errored or never ran in that
        run (Required too); `failed` when every standard ran and a Required one failed
        (no value, it reads F); otherwise `scored`, the average of the standards''
        scores weighted by importance (Required and Major 2, Minor 1). `score_display.tone`
