        schema:
          type: string
          format: uuid
        required: true
      tags:
      - standards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandardTestRequest'
        required: true
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardTestResult'
          description: ''
components:
  schemas:
    AIUsage:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/BudgetPeriodEnum'
        starts:
          type: string
          format: date-time
        budgets:
          $ref: '#/components/schemas/BudgetSummary'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderUsage'
          description: 'Token counts are per model: models are priced apart.'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryUsage'
        standards:
          type: array
          items:
            $ref: '#/components/schemas/StandardUsage'
          description: Biggest first.
      required:
      - budgets
      - categories
      - period
      - providers
      - standards
      - starts
    ActiveStandard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        importance:
          allOf:
          - $ref: '#/components/schemas/ImportanceEnum'
          description: |-
            How much the standard matters to this project: required: if it fails, the project fails; major: counts fully toward this project's score; minor: counts less toward this project's score.

            * `required` - Required
            * `major` - Major
            * `minor` - Minor
        rules:
          type: object
          additionalProperties: {}
          description: 'Extracted enforcement rules: watched files, forbidden patterns,
            flags.'
        enabled:
          type: boolean
        draft:
          type: boolean
        labels:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string
        last_execution:
          allOf:
          - $ref: '#/components/schemas/LastExecution'
          nullable: true
      required:
      - description
      - draft
      - enabled
      - id
      - importance
      - labels
      - languages
      - last_execution
      - name
      - rules
    AttachedStandard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        enabled:
          type: boolean
        draft:
          type: boolean
      required:
      - draft
      - enabled
      - id
      - name
    AttachedStandardImportance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        importance:
          $ref: '#/components/schemas/ImportanceEnum'
      required:
      - id
      - importance
      - name
    AttentionProject:
      type: object
      properties:
        project:
          $ref: '#/components/schemas/ProjectRef'
        tone:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          description: |-
            failed or needs_attention.

            * `healthy` - healthy
            * `needs_attention` - needs_attention
            * `failed` - failed
            * `unknown` - unknown
        grade:
          allOf:
          - $ref: '#/components/schemas/ScoreDisplay'
          nullable: true
          description: Null when the project has no score.
        why:
          type: string
          description: 'e.g. "Lint failing", "No score: …", "Below par: Docs", "Not
            checked yet".'
        owner:
          type: string
        stacks:
          type: array
          items:
            type: string
      required:
      - grade
      - owner
      - project
      - stacks
      - tone
      - why
    AuthMethodEnum:
      enum:
      - pat
      - github_app
      type: string
      description: |-
        * `pat` - pat
        * `github_app` - github_app
    Branch:
      type: object
      properties:
        name:
          type: string
        is_default:
          type: boolean
      required:
      - is_default
      - name
    Budget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider:
          $ref: '#/components/schemas/ProviderRef'
        model:
          type: string
        period:
          $ref: '#/components/schemas/BudgetPeriodEnum'
        input_limit:
          type: integer
          nullable: true
        output_limit:
          type: integer
          nullable: true
        low_at_percent:
          type: integer
          nullable: true
          description: 'Warn owners and admins when this much is left; null: only
            when used up.'
        stop_at_limit:
          type: boolean
          description: Hold back new runs on the model once used up.
        used:
          allOf:
          - $ref: '#/components/schemas/Tokens'
          description: What the current period has used.
        level:
          allOf:
          - $ref: '#/components/schemas/BudgetLevelEnum'
          description: |-
            ok, near (low) or reached.

            * `ok` - ok
            * `near` - near
            * `reached` - reached
        stops_runs:
          type: boolean
        window:
          $ref: '#/components/schemas/BudgetWindow'
      required:
      - id
      - input_limit
      - level
      - low_at_percent
      - model
      - output_limit
      - period
      - provider
      - stop_at_limit
      - stops_runs
      - used
      - window
    BudgetCreateRequest:
      type: object
      properties:
        provider_id:
          type: string
          format: uuid
        model:
          type: string
          minLength: 1
        period:
          $ref: '#/components/schemas/BudgetPeriodEnum'
        input_limit:
          type: integer
          minimum: 1
          nullable: true
        output_limit:
          type: integer
          minimum: 1
          nullable: true
        low_at_percent:
          type: integer
          maximum: 99
          minimum: 1
          nullable: true
        stop_at_limit:
          type: boolean
          default: false
      required:
      - model
      - period
      - provider_id
    BudgetLevelEnum:
      enum:
      - ok
      - near
      - reached
      type: string
      description: |-
        * `ok` - ok
        * `near` - near
        * `reached` - reached
    BudgetPeriodEnum:
      enum:
      - day
      - week
      - month
      type: string
      description: |-
        * `day` - day
        * `week` - week
        * `month` - month
    BudgetSummary:
      type: object
      properties:
        total:
          type: integer
        ok:
          type: integer
        near:
          type: integer
          description: At or under their low mark.
        used_up:
          type: integer
        stopping:
          type: integer
          description: Used up and stopping runs.
      required:
      - near
      - ok
      - stopping
      - total
      - used_up
    BudgetWindow:
      type: object
      properties:
        starts:
          type: string
          format: date-time
          description: When the current period began (workspace's local time).
        last_day:
          type: string
          format: date
        resets:
          type: string
          format: date-time
          description: When it starts over from zero.
      required:
      - last_day
      - resets
      - starts
    BudgetableModel:
      type: object
      properties:
        provider:
          $ref: '#/components/schemas/ProviderRef'
        model:
          type: string
        roles:
          type: array
          items:
            type: string
          description: Roles that use it (GitGrit calls these).
        has_budget:
          type: boolean
        blocked:
          type: boolean
          description: 'No budget: the model does not run.'
      required:
      - blocked
      - has_budget
      - model
      - provider
      - roles
    CategoryUsage:
      type: object
      properties:
        category:
          $ref: '#/components/schemas/UsageCategoryEnum'
        label:
          type: string
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        calls:
          type: integer
      required:
      - calls
      - category
      - input_tokens
      - label
      - output_tokens
    CheckResult:
      type: object
      properties:
        execution_id:
          type: string
          format: uuid
        standard_id:
          type: string
          format: uuid
          nullable: true
        standard_name:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        score:
          type: integer
          nullable: true
          description: Null while running.
        message:
          type: string
        branch:
          type: string
        commit_sha:
          type: string
          description: Empty until the run is pinned to a commit.
        ran_at:
          type: string
          format: date-time
        still_attached:
          type: boolean
          description: 'Commit views only: whether the standard is still attached.'
      required:
      - branch
      - commit_sha
      - execution_id
      - message
      - ran_at
      - score
      - standard_id
      - standard_name
      - status
    ChecksByWeek:
      type: object
      properties:
        this_week:
          type: integer
        last_week:
          type: integer
        peak:
          type: integer
          description: The busiest of the last four (rolling) weeks.
      required:
      - last_week
      - peak
      - this_week
    Commit:
      type: object
      properties:
        score:
          type: integer
          nullable: true
        score_display:
          $ref: '#/components/schemas/ScoreDisplay'
        passed:
          type: integer
        failed:
          type: integer
        errored:
          type: integer
        sha:
          type: string
        title:
          type: string
        author:
          type: string
        date:
          type: string
          format: date-time
          nullable: true
        url:
          type: string
        checked:
          type: boolean
        running:
          type: integer
          description: Checks still running on this commit.
        commit_score:
          allOf:
          - $ref: '#/components/schemas/CommitScore'
          nullable: true
          description: Null when the commit was never checked.
        results:
          type: array
          items:
            $ref: '#/components/schemas/CheckResult'
        expected_but_never_ran:
          type: array
          items:
            $ref: '#/components/schemas/StandardRef'
          description: Standards this commit's check expected that never ran on it.
      required:
      - author
      - checked
      - commit_score
      - date
      - errored
      - expected_but_never_ran
      - failed
      - passed
      - results
      - running
      - score
      - score_display
      - sha
      - title
      - url
    CommitPage:
      type: object
      properties:
        branch:
          type: string
        page:
          type: integer
        has_more:
          type: boolean
        commits:
          type: array
          items:
            $ref: '#/components/schemas/Commit'
      required:
      - branch
      - commits
      - has_more
      - page
    CommitScore:
      type: object
      properties:
        outcome:
          allOf:
          - $ref: '#/components/schemas/OutcomeEnum'
          description: |-
            The one answer: read this first. checking: a run on the commit is still going; no_score: an expected standard errored or never ran (Required too), so nothing is reported; failed: every standard ran and a Required one failed (no value, it reads F); scored: every standard ran, none Required failed: the importance-weighted average, 0-100, even 0.

            * `checking` - checking
            * `no_score` - no_score
            * `failed` - failed
            * `scored` - scored
        value:
          type: integer
          nullable: true
          description: The score, 0-100; only when outcome is scored, null otherwise.
        reason:
          type: string
          description: Why it failed ("X failing") or has no score ("X errored", "Y
            not run"); empty otherwise.
        display:
          $ref: '#/components/schemas/ScoreDisplay'
        standards:
          $ref: '#/components/schemas/StandardsProgress'
        commit:
          $ref: '#/components/schemas/ScoredCommitRef'
      required:
      - commit
      - display
      - outcome
      - reason
      - standards
      - value
    CommitUploadRequest:
      type: object
      properties:
        archive:
          type: string
          format: binary
          description: The project's files as a .zip or .tar.gz.
        message:
          type: string
          default: ''
          description: The commit message; its first line is the title.
        branch:
          type: string
          default: ''
          description: Defaults to the project's default branch. Standards' Branch/Tag
            Filter matches it.
          maxLength: 255
      required:
      - archive
    CommitUploadResult:
      type: object
      properties:
        commit:
          $ref: '#/components/schemas/UploadedCommit'
        created:
          type: boolean
          description: False when the same archive was uploaded before (it is checked
            again).
        queued:
          type: integer
        message:
          type: string
          description: What was queued, in a sentence.
      required:
      - commit
      - created
      - message
      - queued
    Component:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        path:
          type: string
          description: Where it lives in the repository; "" for the root component.
        project:
          $ref: '#/components/schemas/ComponentProject'
        stacks:
          type: array
