openapi: 3.0.3
info:
  title: GitGrit API
  version: 1.0.0
  description: 'Public REST API for GitGrit: projects, compliance status and standards.
    Every workspace-scoped call names its workspace in the URL; `GET /api/v1/me/`
    lists the workspaces the caller can use. Authenticate with an OAuth 2.0 access
    token (`gitgrit auth login`: authorization code + PKCE, discovery at `/.well-known/oauth-authorization-server`)
    or a `grit_` token from your profile page, which is fixed to one workspace.'
paths:
  /api/v1/me/:
    get:
      operationId: get_me
      description: 'What the token acts as and the workspaces it can reach: every
        workspace the user belongs to for an OAuth or personal token; just its own,
        with no user, for a workspace token.'
      summary: Who am I
      tags:
      - auth
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/workspaces/{workspace_id}/connections/:
    get:
      operationId: list_connections
      description: Tokens are never returned.
      summary: List git platform connections
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - connections
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
          description: ''
    post:
      operationId: create_connection
      description: 'Owners and admins only. For GitHub, the GitHub App is recommended
        instead: install it from workspace settings in the browser.'
      summary: Connect a platform with an access token
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - connections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreateRequest'
        required: true
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
          description: ''
  /api/v1/workspaces/{workspace_id}/connections/{connection_id}/repositories/:
    get:
      operationId: list_repositories
      description: Up to 25, filtered by `q` (matched against `org/repo`). 502 when
        the platform refuses.
      summary: Repositories a connection can reach
      parameters:
      - in: path
        name: connection_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: q
        schema:
          type: string
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - connections
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Repository'
          description: ''
  /api/v1/workspaces/{workspace_id}/marketplace/:
    get:
      operationId: get_marketplace
      description: Every pack and standard, with this workspace's install state.
      summary: Browse the marketplace
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - marketplace
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Marketplace'
          description: ''
  /api/v1/workspaces/{workspace_id}/marketplace/packs/{slug}/:
    get:
      operationId: get_marketplace_pack
      description: Each standard carries this workspace's install state.
      summary: A pack and its standards
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - marketplace
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplacePack'
          description: ''
  /api/v1/workspaces/{workspace_id}/marketplace/packs/{slug}/install/:
    post:
      operationId: install_marketplace_pack
      description: Standards the workspace already has are skipped. Installed standards
        are enabled but attached to no project.
      summary: Install every standard in a pack
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - marketplace
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackInstall'
          description: ''
  /api/v1/workspaces/{workspace_id}/marketplace/standards/{slug}/install/:
    post:
      operationId: install_marketplace_standard
      description: 'Returns the existing copy, with `created: false`, when already
        installed.'
      summary: Install one marketplace standard
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - marketplace
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstalledStandard'
          description: ''
  /api/v1/workspaces/{workspace_id}/marketplace/standards/{slug}/update/:
    post:
      operationId: update_marketplace_standard
      description: The new version is queued on every project it's attached to.
      summary: Update an installed standard to the marketplace's latest version
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - marketplace
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceUpdate'
          description: ''
  /api/v1/workspaces/{workspace_id}/projects/:
    get:
      operationId: list_projects
      description: 'The projects collection: listing (inherited) and adding.'
      summary: List projects
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
    post:
      operationId: create_project
      description: Registers a webhook unless the connection is a GitHub App, reads
        the repository's languages, and queues the attached standards to run once.
        409 when it's already a project.
      summary: Add a repository as a project
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
        required: true
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreated'
          description: ''
  /api/v1/workspaces/{workspace_id}/projects/{project_id}/:
    get:
      operationId: get_project
      description: Every attached standard, including drafts and disabled ones, which
        don't run.
      summary: Get a project with its attached standards
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
    patch:
      operationId: update_project
      description: Only the fields sent change.
      summary: Update a project's lifecycle or owner
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectUpdateRequest'
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
    delete:
      operationId: delete_project
      description: Also removes its webhook from the platform (best effort).
      summary: Remove a project
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '204':
          description: No response body
  /api/v1/workspaces/{workspace_id}/projects/{project_id}/branches/:
    get:
      operationId: list_project_branches
      description: The default branch first. Read from the Git platform.
      summary: List a project's branches
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - health
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
          description: ''
  /api/v1/workspaces/{workspace_id}/projects/{project_id}/checks/:
    post:
      operationId: run_project_check
      description: Runs the standards that apply to the branch, in the background,
        on one commit or on the branch's latest commit. Standards already running
        are left alone.
      summary: Check a commit now
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - health
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCheckRequest'
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCheckResult'
          description: ''
  /api/v1/workspaces/{workspace_id}/projects/{project_id}/commits/:
    get:
      operationId: list_project_commits
      description: Newest first, 5 per page, from the Git platform (falls back to
        the commits GitGrit checked). Unchecked commits have empty `results`.
      summary: A branch's commits with their checks
      parameters:
      - in: query
        name: branch
        schema:
          type: string
      - in: query
        name: page
        schema:
          type: integer
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - health
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitPage'
          description: ''
  /api/v1/workspaces/{workspace_id}/projects/{project_id}/commits/{sha}/:
    get:
      operationId: get_project_commit
      description: From what GitGrit recorded; 404 when the commit was never checked.
        Poll this after `run_project_check` until `running` is 0; `commit_score.state`
        then says whether the commit is scored (`complete`) or not every expected
        standard finished (`incomplete`).
      summary: One commit's checks
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: sha
        schema:
          type: string
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - health
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Commit'
          description: ''
  /api/v1/workspaces/{workspace_id}/projects/{project_id}/health/:
    get:
      operationId: get_project_health
      description: 'Without `branch`: the project''s health — its score, the newest
        commit on the default branch that every expected standard finished on (`commit_score`),
        and the results behind it. With `branch`: that branch''s. A Required standard
        that failed or could not be verified makes the score 0; otherwise it is the
        average of the standards'' scores weighted by importance (Required and Major
        2, Minor 1). `newer_commit` is a newer commit with no score yet. Levels: healthy
        ≥ 80, warning ≥ 50, critical below.'
      summary: Project or branch health
      parameters:
      - in: query
        name: branch
        schema:
          type: string
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - health
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectHealth'
          description: ''
  /api/v1/workspaces/{workspace_id}/projects/{project_id}/standards/:
    get:
      operationId: list_project_standards
      description: Each carries the extracted `rules` used for local enforcement.
      summary: Active standards attached to a project
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveStandard'
          description: ''
    post:
      operationId: attach_project_standards
      description: Newly attached, enabled standards are queued to run on it.
      summary: Attach standards to a project
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandardIdsRequest'
        required: true
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStandardsChange'
          description: ''
  /api/v1/workspaces/{workspace_id}/projects/{project_id}/standards/{standard_id}/:
    patch:
      operationId: set_project_standard_importance
      description: How much the standard matters to this project. The standard must
        be attached.
      summary: Set an attached standard's importance
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: standard_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedImportanceRequest'
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachedStandardImportance'
          description: ''
    delete:
      operationId: detach_project_standard
      description: Its past results stay; it just stops running on the project.
      summary: Detach a standard from a project
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: standard_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStandardsChange'
          description: ''
  /api/v1/workspaces/{workspace_id}/projects/{project_id}/status/:
    get:
      operationId: get_project_status
      description: |-
        Scoped to the workspace named in the URL.

        A user (OAuth or personal token) must be a member of it; a workspace token
        reaches only its own workspace. Anything else is a 404, so workspace ids
        cannot be probed. Service errors map onto HTTP: a tenant-scoped miss is
        404, any other ``ValueError`` (e.g. standard code without ``evaluate``)
        is 400.
      summary: Compliance grade and top offenders
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectStatus'
          description: ''
  /api/v1/workspaces/{workspace_id}/projects/resolve/:
    get:
      operationId: resolve_project
      description: Pass `repo_full_path` (e.g. `acme/backend`) and/or `web_url` —
        raw `git remote get-url origin` output is accepted. A miss returns 404 with
        up to 5 close candidates.
      summary: Resolve a git remote to a project
      parameters:
      - in: query
        name: repo_full_path
        schema:
          type: string
      - in: query
        name: web_url
        schema:
          type: string
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedProject'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectNotFound'
          description: ''
  /api/v1/workspaces/{workspace_id}/standards/:
    get:
      operationId: list_standards
      description: |-
        Scoped to the workspace named in the URL.

        A user (OAuth or personal token) must be a member of it; a workspace token
        reaches only its own workspace. Anything else is a 404, so workspace ids
        cannot be probed. Service errors map onto HTTP: a tenant-scoped miss is
        404, any other ``ValueError`` (e.g. standard code without ``evaluate``)
        is 400.
      summary: List standards
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - standards
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StandardSummary'
          description: ''
    post:
      operationId: create_standard
      description: An active standard attached to projects is queued to run on save.
      summary: Create a standard
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - standards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandardCreateRequest'
        required: true
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardMutation'
          description: ''
  /api/v1/workspaces/{workspace_id}/standards/{standard_id}/:
    get:
      operationId: get_standard
      description: |-
        Scoped to the workspace named in the URL.

        A user (OAuth or personal token) must be a member of it; a workspace token
        reaches only its own workspace. Anything else is a 404, so workspace ids
        cannot be probed. Service errors map onto HTTP: a tenant-scoped miss is
        404, any other ``ValueError`` (e.g. standard code without ``evaluate``)
        is 400.
      summary: Get a standard with its code and recent executions
      parameters:
      - in: path
        name: standard_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - standards
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardDetail'
          description: ''
    patch:
      operationId: update_standard
      description: 'Only the fields sent change; every save is versioned. Drafts are
        always disabled — to publish, send `draft: false, enabled: true`.'
      summary: Update a standard
      parameters:
      - in: path
        name: standard_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - standards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStandardUpdateRequest'
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardMutation'
          description: ''
    delete:
      operationId: delete_standard
      description: |-
        Scoped to the workspace named in the URL.

        A user (OAuth or personal token) must be a member of it; a workspace token
        reaches only its own workspace. Anything else is a 404, so workspace ids
        cannot be probed. Service errors map onto HTTP: a tenant-scoped miss is
        404, any other ``ValueError`` (e.g. standard code without ``evaluate``)
        is 400.
      summary: Delete a standard
      parameters:
      - in: path
        name: standard_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - standards
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '204':
          description: No response body
  /api/v1/workspaces/{workspace_id}/standards/{standard_id}/disable/:
    post:
      operationId: disable_standard
      description: It stops running everywhere; its attachments stay.
      summary: Turn a standard off
      parameters:
      - in: path
        name: standard_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - standards
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnabled'
          description: ''
  /api/v1/workspaces/{workspace_id}/standards/{standard_id}/enable/:
    post:
      operationId: enable_standard
      description: Queues it on every project it's attached to. 400 for a draft.
      summary: Turn a standard on
      parameters:
      - in: path
        name: standard_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - standards
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardEnabled'
          description: ''
  /api/v1/workspaces/{workspace_id}/standards/test/:
    post:
      operationId: test_standard
      description: Runs in the gVisor sandbox; nothing is saved.
      summary: Dry-run standard code against mock project data
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - standards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StandardTestRequest'
        required: true
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardTestResult'
          description: ''
components:
  schemas:
    ActiveStandard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        importance:
          allOf:
          - $ref: '#/components/schemas/ImportanceEnum'
          description: |-
            How much the standard matters to this project: required: if it fails, the project fails; major: counts fully toward this project's score; minor: counts less toward this project's score.

            * `required` - Required
            * `major` - Major
            * `minor` - Minor
        rules:
          type: object
          additionalProperties: {}
          description: 'Extracted enforcement rules: watched files, forbidden patterns,
            flags.'
        enabled:
          type: boolean
        draft:
          type: boolean
        labels:
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            type: string
        last_execution:
          allOf:
          - $ref: '#/components/schemas/LastExecution'
          nullable: true
      required:
      - description
      - draft
      - enabled
      - id
      - importance
      - labels
      - languages
      - last_execution
      - name
      - rules
    AttachedStandard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        enabled:
          type: boolean
        draft:
          type: boolean
      required:
      - draft
      - enabled
      - id
      - name
    AttachedStandardImportance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        importance:
          $ref: '#/components/schemas/ImportanceEnum'
      required:
      - id
      - importance
      - name
    AuthMethodEnum:
      enum:
      - pat
      - github_app
      type: string
      description: |-
        * `pat` - pat
        * `github_app` - github_app
    Branch:
      type: object
      properties:
        name:
          type: string
        is_default:
          type: boolean
      required:
      - is_default
      - name
    CheckResult:
      type: object
      properties:
        execution_id:
          type: string
          format: uuid
        standard_id:
          type: string
          format: uuid
          nullable: true
        standard_name:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        score:
          type: integer
          nullable: true
          description: Null while running.
        message:
          type: string
        branch:
          type: string
        commit_sha:
          type: string
          description: Empty until the run is pinned to a commit.
        ran_at:
          type: string
          format: date-time
        still_attached:
          type: boolean
          description: 'Commit views only: whether the standard is still attached.'
      required:
      - branch
      - commit_sha
      - execution_id
      - message
      - ran_at
      - score
      - standard_id
      - standard_name
      - status
    Commit:
      type: object
      properties:
        score:
          type: integer
          nullable: true
        level:
          $ref: '#/components/schemas/LevelEnum'
        passed:
          type: integer
        failed:
          type: integer
        errored:
          type: integer
        sha:
          type: string
        title:
          type: string
        author:
          type: string
        date:
          type: string
          format: date-time
          nullable: true
        url:
          type: string
        checked:
          type: boolean
        running:
          type: integer
          description: Checks still running on this commit.
        commit_score:
          allOf:
          - $ref: '#/components/schemas/CommitScore'
          nullable: true
          description: Null when the commit was never checked.
        results:
          type: array
          items:
            $ref: '#/components/schemas/CheckResult'
        not_run:
          type: array
          items:
            $ref: '#/components/schemas/StandardRef'
          description: Standards that apply now but did not run on this commit.
      required:
      - author
      - checked
      - commit_score
      - date
      - errored
      - failed
      - level
      - not_run
      - passed
      - results
      - running
      - score
      - sha
      - title
      - url
    CommitPage:
      type: object
      properties:
        branch:
          type: string
        page:
          type: integer
        has_more:
          type: boolean
        commits:
          type: array
          items:
            $ref: '#/components/schemas/Commit'
      required:
      - branch
      - commits
      - has_more
      - page
    CommitScore:
      type: object
      properties:
        value:
          type: integer
          nullable: true
          description: The commit's last complete score, 0-100; null until every expected
            standard has finished on it.
        failed:
          type: boolean
          description: 'A Required standard failed or could not be verified: the value
            is 0.'
        reason:
          type: string
          description: Why the value is 0; empty otherwise.
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          description: |-
            The commit's newest check: complete, in_progress or incomplete (finished without every expected standard).

            * `complete` - complete
            * `in_progress` - in_progress
            * `incomplete` - incomplete
        standards:
          $ref: '#/components/schemas/StandardsProgress'
        commit:
          $ref: '#/components/schemas/ScoredCommitRef'
      required:
      - commit
      - failed
      - reason
      - standards
      - state
      - value
    Connection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        platform:
          type: string
        auth_method:
          $ref: '#/components/schemas/AuthMethodEnum'
        base_url:
          type: string
        account_login:
          type: string
          nullable: true
          description: 'GitHub App connections: the org or user.'
        created_at:
          type: string
          format: date-time
      required:
