          type: object
          additionalProperties: {}
          description: 'Mock project data: files [{path, content}], languages {name:
            pct}, members, contributors, default_branch, topics, metadata.'
      required:
      - code
    StandardTestResult:
      type: object
      properties:
        passed:
          type: boolean
        score:
          type: integer
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
      required:
      - details
      - message
      - passed
      - score
    StandardsProgress:
      type: object
      properties:
        expected:
          type: integer
          description: Standards the commit's newest check expects.
        finished:
          type: integer
          description: Of those, how many have a finished result.
      required:
      - expected
      - finished
    StateEnum:
      enum:
      - complete
      - in_progress
      - incomplete
      type: string
      description: |-
        * `complete` - complete
        * `in_progress` - in_progress
        * `incomplete` - incomplete
    StatusEnum:
      enum:
      - running
      - passed
      - failed
      - error
      - skipped
      type: string
      description: |-
        * `running` - running
        * `passed` - passed
        * `failed` - failed
        * `error` - error
        * `skipped` - skipped
    TokenTypeEnum:
      enum:
      - oauth
      - personal_token
      - workspace_token
      type: string
      description: |-
        * `oauth` - oauth
        * `personal_token` - personal_token
        * `workspace_token` - workspace_token
    UserRef:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
      required:
      - email
      - id
      - username
    WebhookEnum:
      enum:
      - app
      - active
      - missing
      type: string
      description: |-
        * `app` - app
        * `active` - active
        * `missing` - missing
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          nullable: true
          description: owner, admin or member; null for a workspace token, which has
            no user.
      required:
      - id
      - name
      - role
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A `grit_pat_` personal token (profile page; acts as you in all
        your workspaces) or a `grit_ws_` workspace token (workspace settings; reaches
        only that workspace, for CI/CD).
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize/
          tokenUrl: /oauth/token/
          refreshUrl: /oauth/token/
          scopes:
            read: Read your projects, compliance status and standards
            write: Create, edit and delete standards
