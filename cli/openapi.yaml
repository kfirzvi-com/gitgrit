      - finished
    StatusEnum:
      enum:
      - running
      - passed
      - failed
      - error
      - skipped
      type: string
      description: |-
        * `running` - running
        * `passed` - passed
        * `failed` - failed
        * `error` - error
        * `skipped` - skipped
    TokenTypeEnum:
      enum:
      - oauth
      - personal_token
      - workspace_token
      type: string
      description: |-
        * `oauth` - oauth
        * `personal_token` - personal_token
        * `workspace_token` - workspace_token
    Tokens:
      type: object
      properties:
        input_tokens:
          type: integer
        output_tokens:
          type: integer
      required:
      - input_tokens
      - output_tokens
    TrendPoint:
      type: object
      properties:
        day:
          type: string
          format: date
        healthy:
          type: integer
        total:
          type: integer
      required:
      - day
      - healthy
      - total
    TypeEnum:
      enum:
      - repository
      - artifact
      type: string
      description: |-
        * `repository` - repository
        * `artifact` - artifact
    UploadedCommit:
      type: object
      properties:
        sha:
          type: string
          description: The archive's content hash; poll `commits/<sha>/` for its checks.
        message:
          type: string
        branch:
          type: string
        author:
          type: string
        size:
          type: integer
        file_count:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
      - author
      - branch
      - created_at
      - file_count
      - message
      - sha
      - size
    UsageCategoryEnum:
      enum:
      - map
      - standard
      type: string
      description: |-
        * `map` - map
        * `standard` - standard
    UserRef:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
      required:
      - email
      - id
      - username
    WarningLight:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/WarningLightKeyEnum'
        title:
          type: string
        count:
          type: integer
        lit:
          type: boolean
          description: A light turns on only when something needs action.
        tone:
          $ref: '#/components/schemas/LevelEnum'
      required:
      - count
      - key
      - lit
      - title
      - tone
    WarningLightKeyEnum:
      enum:
      - failed
      - below_a
      - no_score
      - ai_budget
      type: string
      description: |-
        * `failed` - failed
        * `below_a` - below_a
        * `no_score` - no_score
        * `ai_budget` - ai_budget
    WebhookEnum:
      enum:
      - app
      - active
      - missing
      - none
      type: string
      description: |-
        * `app` - app
        * `active` - active
        * `missing` - missing
        * `none` - none
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          nullable: true
          description: owner, admin or member; null for a workspace token, which has
            no user.
      required:
      - id
      - name
      - role
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A `grit_pat_` personal token (profile page; acts as you in all
        your workspaces) or a `grit_ws_` workspace token (workspace settings; reaches
        only that workspace, for CI/CD).
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize/
          tokenUrl: /oauth/token/
          refreshUrl: /oauth/token/
          scopes:
            read: Read your projects, compliance status and standards
            write: Create, edit and delete standards
