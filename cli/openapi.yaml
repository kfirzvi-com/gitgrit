openapi: 3.0.3
info:
  title: GitGrit API
  version: 1.0.0
  description: 'Public REST API for GitGrit: projects, compliance status and standards.
    Every workspace-scoped call names its workspace in the URL; `GET /api/v1/me/`
    lists the workspaces the caller can use. Authenticate with an OAuth 2.0 access
    token (`gitgrit auth login`: authorization code + PKCE, discovery at `/.well-known/oauth-authorization-server`)
    or a `grit_` token from your profile page, which is fixed to one workspace.'
paths:
  /api/v1/me/:
    get:
      operationId: get_me
      description: 'What the token acts as and the workspaces it can reach: every
        workspace the user belongs to for an OAuth or personal token; just its own,
        with no user, for a workspace token.'
      summary: Who am I
      tags:
      - auth
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/workspaces/{workspace_id}/ai/budgets/:
    get:
      operationId: list_ai_budgets
      description: |-
        Scoped to the workspace named in the URL.

        A user (OAuth or personal token) must be a member of it; a workspace token
        reaches only its own workspace. Anything else is a 404, so workspace ids
        cannot be probed. Service errors map onto HTTP: a tenant-scoped miss is
        404, any other ``ValueError`` (e.g. standard code without ``evaluate``)
        is 400.
      summary: AI budgets, with what each current period has used
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Budget'
          description: ''
    post:
      operationId: create_ai_budget
      description: One budget per provider, model and period. A model runs only once
        it has a budget.
      summary: Set a budget on a model (owners and admins)
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCreateRequest'
        required: true
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
  /api/v1/workspaces/{workspace_id}/ai/budgets/{budget_id}/:
    patch:
      operationId: update_ai_budget
      description: |-
        Scoped to the workspace named in the URL.

        A user (OAuth or personal token) must be a member of it; a workspace token
        reaches only its own workspace. Anything else is a 404, so workspace ids
        cannot be probed. Service errors map onto HTTP: a tenant-scoped miss is
        404, any other ``ValueError`` (e.g. standard code without ``evaluate``)
        is 400.
      summary: Change a budget (owners and admins)
      parameters:
      - in: path
        name: budget_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBudgetUpdateRequest'
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
          description: ''
    delete:
      operationId: delete_ai_budget
      description: With no budget left, the model stops running.
      summary: Remove a budget (owners and admins)
      parameters:
      - in: path
        name: budget_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '204':
          description: No response body
  /api/v1/workspaces/{workspace_id}/ai/models/:
    get:
      operationId: list_ai_models
      description: 'Only models with a budget run: a model without one is blocked.'
      summary: Models a budget can cover
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetableModel'
          description: ''
  /api/v1/workspaces/{workspace_id}/ai/usage/:
    get:
      operationId: get_ai_usage
      description: Input and output tokens per provider and model (models are priced
        apart, so never added up across models), each model's budgets, tokens per
        kind of work, and how LLM-standard tokens split between standards.
      summary: AI tokens spent this day, week or month
      parameters:
      - in: query
        name: period
        schema:
          type: string
          enum:
          - day
          - month
          - week
        description: The current day, week or month (default).
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIUsage'
          description: ''
  /api/v1/workspaces/{workspace_id}/components/:
    get:
      operationId: list_components
      description: 'A component is a deployable unit inside a repository: every project
        has a root one (path ""), a monorepo one per service.'
      summary: The workspace's components and the stacks each belongs to
      parameters:
      - in: query
        name: project_id
        schema:
          type: string
          format: uuid
        description: Only this project's.
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - stacks
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Component'
          description: ''
  /api/v1/workspaces/{workspace_id}/connections/:
    get:
      operationId: list_connections
      description: Tokens are never returned.
      summary: List git platform connections
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - connections
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
          description: ''
    post:
      operationId: create_connection
      description: 'Owners and admins only. For GitHub, the GitHub App is recommended
        instead: install it from workspace settings in the browser.'
      summary: Connect a platform with an access token
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - connections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreateRequest'
        required: true
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
          description: ''
  /api/v1/workspaces/{workspace_id}/connections/{connection_id}/repositories/:
    get:
      operationId: list_repositories
      description: Up to 25, filtered by `q` (matched against `org/repo`). 502 when
        the platform refuses.
      summary: Repositories a connection can reach
      parameters:
      - in: path
        name: connection_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: q
        schema:
          type: string
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - connections
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Repository'
          description: ''
  /api/v1/workspaces/{workspace_id}/llm/providers/:
    get:
      operationId: list_llm_providers
      description: |-
        Scoped to the workspace named in the URL.

        A user (OAuth or personal token) must be a member of it; a workspace token
        reaches only its own workspace. Anything else is a 404, so workspace ids
        cannot be probed. Service errors map onto HTTP: a tenant-scoped miss is
        404, any other ``ValueError`` (e.g. standard code without ``evaluate``)
        is 400.
      summary: LLM providers and the models each key can use
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - llm
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LLMProvider'
          description: ''
    post:
      operationId: create_llm_provider
      description: Finds the models the key can use. A model runs only once it has
        an AI budget (`POST ai/budgets/`) and a role points at it.
      summary: Add a provider (owners and admins)
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - llm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMProviderCreateRequest'
        required: true
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMProviderAdded'
          description: ''
  /api/v1/workspaces/{workspace_id}/llm/providers/{provider_id}/:
    patch:
      operationId: update_llm_provider
      description: |-
        Scoped to the workspace named in the URL.

        A user (OAuth or personal token) must be a member of it; a workspace token
        reaches only its own workspace. Anything else is a 404, so workspace ids
        cannot be probed. Service errors map onto HTTP: a tenant-scoped miss is
        404, any other ``ValueError`` (e.g. standard code without ``evaluate``)
        is 400.
      summary: Change a provider's name, endpoint, key or models (owners and admins)
      parameters:
      - in: path
        name: provider_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - llm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLLMProviderUpdateRequest'
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMProvider'
          description: ''
    delete:
      operationId: delete_llm_provider
      description: Roles pointing at it are cleared.
      summary: Remove a provider (owners and admins)
      parameters:
      - in: path
        name: provider_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - llm
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '204':
          description: No response body
  /api/v1/workspaces/{workspace_id}/llm/providers/{provider_id}/models/refresh/:
    post:
      operationId: refresh_llm_models
      description: |-
        Scoped to the workspace named in the URL.

        A user (OAuth or personal token) must be a member of it; a workspace token
        reaches only its own workspace. Anything else is a 404, so workspace ids
        cannot be probed. Service errors map onto HTTP: a tenant-scoped miss is
        404, any other ``ValueError`` (e.g. standard code without ``evaluate``)
        is 400.
      summary: Find the models the key can use again (owners and admins)
      parameters:
      - in: path
        name: provider_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - llm
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMModelsRefresh'
          description: ''
  /api/v1/workspaces/{workspace_id}/llm/providers/{provider_id}/test/:
    post:
      operationId: test_llm_provider
      description: |-
        Scoped to the workspace named in the URL.

        A user (OAuth or personal token) must be a member of it; a workspace token
        reaches only its own workspace. Anything else is a 404, so workspace ids
        cannot be probed. Service errors map onto HTTP: a tenant-scoped miss is
        404, any other ``ValueError`` (e.g. standard code without ``evaluate``)
        is 400.
      summary: Check that the provider accepts the key
      parameters:
      - in: path
        name: provider_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - llm
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMProviderTest'
          description: ''
  /api/v1/workspaces/{workspace_id}/llm/roles/:
    get:
      operationId: list_llm_roles
      description: |-
        Scoped to the workspace named in the URL.

        A user (OAuth or personal token) must be a member of it; a workspace token
        reaches only its own workspace. Anything else is a 404, so workspace ids
        cannot be probed. Service errors map onto HTTP: a tenant-scoped miss is
        404, any other ``ValueError`` (e.g. standard code without ``evaluate``)
        is 400.
      summary: Which provider and model GitGrit uses for each kind of work
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - llm
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LLMRole'
          description: ''
  /api/v1/workspaces/{workspace_id}/llm/roles/{role}/:
    put:
      operationId: set_llm_role
      description: |-
        Scoped to the workspace named in the URL.

        A user (OAuth or personal token) must be a member of it; a workspace token
        reaches only its own workspace. Anything else is a 404, so workspace ids
        cannot be probed. Service errors map onto HTTP: a tenant-scoped miss is
        404, any other ``ValueError`` (e.g. standard code without ``evaluate``)
        is 400.
      summary: Point a role at a provider and model (owners and admins)
      parameters:
      - in: path
        name: role
        schema:
          type: string
          enum:
          - code
          - reasoning
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - llm
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LLMRoleSetRequest'
        required: true
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LLMRole'
          description: ''
    delete:
      operationId: clear_llm_role
      description: |-
        Scoped to the workspace named in the URL.

        A user (OAuth or personal token) must be a member of it; a workspace token
        reaches only its own workspace. Anything else is a 404, so workspace ids
        cannot be probed. Service errors map onto HTTP: a tenant-scoped miss is
        404, any other ``ValueError`` (e.g. standard code without ``evaluate``)
        is 400.
      summary: Clear a role (owners and admins)
      parameters:
      - in: path
        name: role
        schema:
          type: string
          enum:
          - code
          - reasoning
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - llm
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '204':
          description: No response body
  /api/v1/workspaces/{workspace_id}/marketplace/:
    get:
      operationId: get_marketplace
      description: Every pack and standard, with this workspace's install state.
      summary: Browse the marketplace
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - marketplace
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Marketplace'
          description: ''
  /api/v1/workspaces/{workspace_id}/marketplace/packs/{slug}/:
    get:
      operationId: get_marketplace_pack
      description: Each standard carries this workspace's install state.
      summary: A pack and its standards
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - marketplace
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplacePack'
          description: ''
  /api/v1/workspaces/{workspace_id}/marketplace/packs/{slug}/install/:
    post:
      operationId: install_marketplace_pack
      description: Standards the workspace already has are skipped. Installed standards
        are enabled but attached to no project.
      summary: Install every standard in a pack
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - marketplace
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackInstall'
          description: ''
  /api/v1/workspaces/{workspace_id}/marketplace/standards/{slug}/install/:
    post:
      operationId: install_marketplace_standard
      description: 'Returns the existing copy, with `created: false`, when already
        installed.'
      summary: Install one marketplace standard
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - marketplace
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstalledStandard'
          description: ''
  /api/v1/workspaces/{workspace_id}/marketplace/standards/{slug}/update/:
    post:
      operationId: update_marketplace_standard
      description: The new version is queued on every project it's attached to.
      summary: Update an installed standard to the marketplace's latest version
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - marketplace
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceUpdate'
          description: ''
  /api/v1/workspaces/{workspace_id}/overview/:
    get:
      operationId: get_overview
      description: 'What the dashboard''s cockpit shows: projects counted by health
        (never one grade for many), the warning lights (each lit only when something
        needs action), the projects that need you, commits checked per week and healthy
        projects week by week.'
      summary: 'The workspace at a glance: health, warning lights, what needs you'
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - overview
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
          description: ''
  /api/v1/workspaces/{workspace_id}/projects/:
    get:
      operationId: list_projects
      description: 'The projects collection: listing (inherited) and adding.'
      summary: List projects
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
          description: ''
    post:
      operationId: create_project
      description: |-
        `type: repository` (the default) adds a repository a connection reaches: registers a webhook unless the connection is a GitHub App, reads the repository's languages, and queues the attached standards to run once. 409 when it's already a project.

        `type: artifact` creates a project whose commits are build archives you upload with `POST projects/<id>/commits/`. Idempotent on `external_id`: a repeat returns the existing project with 200.
      summary: 'Add a project: a repository, or an artifact project'
      parameters:
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreated'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCreated'
          description: ''
  /api/v1/workspaces/{workspace_id}/projects/{project_id}/:
    get:
      operationId: get_project
      description: Every attached standard, including drafts and disabled ones, which
        don't run.
      summary: Get a project with its attached standards
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - bearerAuth: []
      - oauth2:
        - read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
          description: ''
    patch:
      operationId: update_project
      description: Only the fields sent change.
      summary: Update a project's lifecycle or owner
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: workspace_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectUpdateRequest'
      security:
      - bearerAuth: []
      - oauth2:
        - write
      responses:
