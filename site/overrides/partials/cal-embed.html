{#
  Book a demo: Cal.com element-click embed, loaded on every page.
  Any element with data-cal-link="gitgrit-demo/30min" data-cal-namespace="30min"
  opens the booking modal. Give it href="https://cal.com/gitgrit-demo/30min" too:
  the plain booking page is the fallback when JS is off.
#}
<script type="text/javascript">
  (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if(typeof namespace === "string"){cal.ns[namespace] = cal.ns[namespace] || api;p(cal.ns[namespace], ar);p(cal, ["initNamespace", namespace]);} else p(cal, ar); return;} p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
  Cal("init", "30min", { origin: "https://app.cal.com" });
  Cal.config = Cal.config || {};
  Cal.config.forwardQueryParams = true;
  Cal.ns["30min"]("ui", {
    theme: "dark",
    cssVarsPerTheme: { dark: { "cal-brand": "#06b6d4" } },  // GitGrit --gg-primary
    hideEventTypeDetails: false,
    layout: "month_view"

  // Cal opens the modal from its own click listener but leaves the link's default

  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("[data-cal-link]")) { e.preventDefault(); }
  });
</script>
