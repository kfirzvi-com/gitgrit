<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Home card: the hero's treatment of its illustration: dark behind the
       headline, fading out so Clark and the team show through below. -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0e13" stop-opacity="0.97"/>
      <stop offset="0.42" stop-color="#0c0e13" stop-opacity="0.9"/>
      <stop offset="0.62" stop-color="#0c0e13" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0c0e13" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#top)"/>
</svg>
