<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Shared card background: the site's navy, its 24px dot grid, and a
       cyan glow behind the logo (top left). -->
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.3" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="logo-glow">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="corner-glow">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0c0e13"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="0" cy="630" r="520" fill="url(#corner-glow)"/>
  <circle cx="70" cy="52" r="70" fill="url(#logo-glow)"/>
</svg>
