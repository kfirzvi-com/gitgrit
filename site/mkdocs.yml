site_name: GitGrit
site_url: !ENV [DOCS_SITE_URL, "https://gitgrit.dev"]
site_description: The engineering standards platform. Turn engineering best practices into everyday reality.
site_author: GitGrit

theme:
  name: material
  custom_dir: overrides
  logo: images/logo.svg
  favicon: images/logo.svg
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tracking
    # navigation.tabs intentionally disabled — the header carries only the
    # logo + a single "Docs" button (see overrides/partials/header.html).
    # navigation.sections / navigation.expand also disabled so each
    # top-level category in the sidebar is a collapsable click-target
    # rather than an always-open header.
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/kfirzvi-com/gitgrit
repo_name: kfirzvi-com/gitgrit

# mkdocs serve only watches docs/ and mkdocs.yml by default. Adding
# overrides/ here makes header.html / home.html edits hot-reload too.
watch:
  - overrides

# Declaring plugins replaces MkDocs' default list, so search is listed too.
plugins:
  - search
  # Share cards (og:image / twitter:image) for every page, rendered at build
  # time from the page's own title and description with our layouts in
  # layouts/. The landing page picks its own layout in its front matter.
  - social:
      # Resolved from the working directory, not this file: run mkdocs from
      # the repo root, as CI and site/README.md do.
      cards_layout_dir: site/layouts
      cards_layout: gitgrit-page

hooks:
  - hooks/whats_new.py   # generates whats-new.md from GitHub releases
  - hooks/cache_bust.py  # ?v=<hash> on extra_css so a deploy never pairs new HTML with cached CSS
  - hooks/social_cards.py  # palette-compresses share cards over 300 KB

nav:
  # Home (index.md) is intentionally absent from the sidebar — it's reached
  # via the logo. Including it would surface a redundant "Home" link in the
  # docs sidebar.
  - Getting Started:
    - Quick Start: getting-started/quickstart.md
    - Workspaces & Members: getting-started/workspaces.md
    - Adding Projects: getting-started/projects.md
    - Command Line: getting-started/cli.md
    - Artifact Projects: getting-started/artifact-projects.md
    - Writing Standards: getting-started/standards.md
  - Features:
    - Standard Marketplace: features/marketplace.md
    - Compliance Badges: features/badges.md
    - Standard Versioning: features/versioning.md
    - Analytics Dashboard: features/analytics.md
  - Standard API:
    - ProjectContext: api/project-context.md
  - Self-Hosting:
    - Overview: self-hosting/index.md
    - Installation: self-hosting/installation.md
    - Operations: self-hosting/operations.md

# Pages reachable outside the sidebar nav:
#   - Home (index.md): the logo links to it.
#   - Legal pages: linked from the footer and product surfaces (OAuth
#     consent, app footer).
#   - Compare pages: linked from the footer.
#   - What's New: generated by hooks/whats_new.py, linked from the header.
not_in_nav: |
  /index.md
  /whats-new.md
  /compare/*.md
  /legal/terms.md
  /legal/privacy.md
  /legal/cookies.md
  /legal/accessibility.md
  /legal/sub-processors.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

extra_css:
  - stylesheets/tokens.css    # shared design tokens — single source of truth
  - stylesheets/custom.css    # Material theme variable mappings and component overrides

extra:
  is_staging: !ENV [DOCS_IS_STAGING, false]
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kfirzvi-com/gitgrit
  generator: false

copyright: "&copy; 2026 GitGrit | The engineering standards platform"
