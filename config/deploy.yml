# GitGrit — Kamal deployment configuration
#
# This is a template. To deploy:
# 1. Create config/deploy.<destination>.yml with your real values
# 2. Create .kamal/secrets.<destination> with your secrets (gitignored)
# 3. Run: kamal setup -d <destination>
#
# Generate a SECRET_KEY (use a static value — regenerating invalidates all sessions):
#   cat /dev/urandom | LC_ALL=C tr -dc 'a-zA-Z0-9' | fold -w 50 | head -n 1

service: gitgrit
image: kfirzvi-com/gitgrit

servers:
  web:
    hosts:
      - <SERVER_IP>
    cmd: gunicorn gitgrit.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:3000 --workers 2 --timeout 65 --keep-alive 5 --access-logfile -
    options:
      volume:
        - /var/run/docker.sock:/var/run/docker.sock
        - /tmp/gitgrit-sandbox:/tmp/gitgrit-sandbox
  # Background worker (Procrastinate). Same image + env as web, no proxy/traffic.
  # Runs the LLM dependency-inference jobs on the 'graph' queue. No Docker
  # socket needed (the agent runs in-process; only policy execution, later,
  # will need the sandbox).
  worker:
    hosts:
      - <SERVER_IP>
    cmd: python manage.py procrastinate worker --queues=graph --concurrency 4

proxy:
  ssl: true
  host: example.com
  app_port: 3000
  healthcheck:
    path: /up/

registry:
  server: ghcr.io
  username: kfirzvi-com
  password:
    - GHCR_TOKEN

builder:
  arch: amd64

env:
  clear:
    DEBUG: "False"
    DB_PORT: "5432"
    DB_NAME: gitgrit
    DB_USER: gitgrit
    SITE_URL: https://example.com
    # GitHub App: non-secret, per-environment. Real values are set in each
    # destination override (config/deploy.<dest>.yml, in the infra repo).
    # ID/slug/client id are public; the private key, webhook secret and OAuth
    # client secret are secrets below.
    #
    # The feature turns itself on once ALL of these are set: id, slug, private
    # key, webhook secret, and the OAuth client id/secret. There is no separate
    # enable flag to get out of step with the config — a half-configured App
    # stays off. GITHUB_APP_ENABLED is only a kill switch: set it to "false" to
    # disable a working App without removing its secrets.
    GITHUB_APP_ENABLED: ""
    GITHUB_APP_ID: ""
    GITHUB_APP_SLUG: ""
    GITHUB_APP_CLIENT_ID: ""
  secret:
    - SECRET_KEY
    - GITGRIT_ENCRYPTION_KEY
    - DB_PASSWORD
    - GITHUB_CLIENT_ID
    - GITHUB_CLIENT_SECRET
    - GITLAB_CLIENT_ID
    - GITLAB_CLIENT_SECRET
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - GITHUB_APP_PRIVATE_KEY
    - GITHUB_APP_WEBHOOK_SECRET
    - GITHUB_APP_CLIENT_SECRET
