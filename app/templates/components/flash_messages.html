{# Always drawn (even empty) so an in-place save can replace it out of band: #}
{# include with oob=True.                                                   #}
<div id="flash-messages"{% if oob %} hx-swap-oob="true"{% endif %}>
{% if messages %}
<div class="space-y-2 mb-4">
  {% for message in messages %}
    <div class="alert {% if message.tags == 'error' %}alert-error{% elif message.tags == 'warning' %}alert-warning{% elif message.tags == 'success' %}alert-success{% else %}alert-info{% endif %}">
      <span>{{ message }}</span>
    </div>
  {% endfor %}
</div>
{% endif %}
</div>
