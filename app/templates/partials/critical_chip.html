{# Read-only level chip ("Critical") for a result whose level is shown as critical; expects `ex` (a StandardExecution). Change the level in the project's standards table. #}
{% load project_tags %}
<span class="badge badge-error badge-outline badge-xs align-middle" data-critical-chip
      title="{{ ex.get_level_display }}: {{ ex.level|level_help }}">{{ ex.get_level_display }}</span>
