{% comment %}One score, as SCORE_REPRESENTATION shows it (app.templatetags.score_tags.score). The
tone picks the colour: healthy green, warning amber, critical red, unknown dim. The one place a
score's tone becomes a colour in templates.{% endcomment %}<span class="tabular-nums{% if size == 'xl' %} text-7xl font-bold leading-none{% elif size == 'lg' %} text-5xl font-bold leading-none{% elif size == 'sm' %} text-sm font-semibold{% else %} font-bold{% endif %}{% if toned %}{% if represented.tone == 'healthy' %} text-success{% elif represented.tone == 'warning' %} text-warning{% elif represented.tone == 'critical' %} text-error{% else %} opacity-50{% endif %}{% endif %}" role="img" aria-label="{{ represented.spoken }}" title="{{ represented.spoken }}" data-score-tone="{{ represented.tone }}"{% if data_attr %} {{ data_attr }}{% endif %}>{{ represented.text }}</span>
