{% comment %}A pre-flight checklist step's mark: a tick when `done`, else its `number`.{% endcomment %}<span class="mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-full {% if done %}gg-tone-bg-healthy text-base-100{% else %}border border-base-content/20 text-sm opacity-80{% endif %}" aria-label="{% if done %}Done{% else %}Step {{ number }}{% endif %}">{% if done %}<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>{% else %}{{ number }}{% endif %}</span>
