{# Body of the "Attach standards" modal on the project page (fetched via HTMX). #}
<form method="post" action="{% url 'project_standards' project.pk %}">
  {% csrf_token %}
  {% include "partials/standard_picker.html" %}
  <div class="modal-action">
    <button type="button" class="btn btn-ghost"
            onclick="document.getElementById('standards_modal').close()">Cancel</button>
    <button type="submit" class="btn btn-primary">Save</button>
  </div>
</form>
