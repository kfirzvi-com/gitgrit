{# The project page's Standards tab body (fetched via HTMX): pick the workspace #}
{# standards that apply to this project. Newly attached standards are queued #}
{# to run in the background; saving returns to this tab.                      #}
<form method="post" action="{% url 'project_standards' project.pk %}">
  {% csrf_token %}
  {% include "partials/standard_picker.html" %}
  <div class="flex justify-end pt-4">
    <button type="submit" class="btn btn-primary btn-sm">Save</button>
  </div>
</form>
