{# "Select all" / "Clear selection" / "Set importance" for a standard_picker. Works inside the picker or #}
{# anywhere in the same <form> (the JS falls back to the form's picker). size: btn-xs|btn-sm #}
<div class="flex gap-2">
  <button type="button" class="btn {{ size|default:'btn-xs' }} btn-outline"
          title="Check every standard currently listed (respects the search filter)"
          onclick="selectAllStandardPicker(this)">Select all</button>
  <button type="button" class="btn {{ size|default:'btn-xs' }} btn-outline"
          title="Uncheck every standard currently listed (respects the search filter)"
          onclick="clearAllStandardPicker(this)">Clear selection</button>
  <div class="dropdown dropdown-top">
    <div tabindex="0" role="button" class="btn {{ size|default:'btn-xs' }} btn-outline"
         title="Set the importance of every checked standard currently listed (respects the search and filter)">Set importance</div>
    <ul tabindex="0" class="dropdown-content menu z-10 w-40 rounded-box bg-base-200 p-1 shadow">
      {% for rule in importance_rules %}
        <li><button type="button" title="{{ rule.help }}" class="gg-importance-text gg-importance-{{ rule.importance.value }}"
                    onclick="setStandardPickerImportance(this, '{{ rule.importance.value }}'); document.activeElement.blur()">{{ rule.label }}</button></li>
      {% endfor %}
    </ul>
  </div>
</div>
