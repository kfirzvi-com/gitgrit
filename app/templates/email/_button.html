{# A call-to-action button that survives Outlook: {% include "email/_button.html" with url=… label=… %} #}
<table role="presentation" class="button" cellpadding="0" cellspacing="0" border="0">
  <tr><td class="button-cell"><a href="{{ url }}" class="button-link">{{ label }}</a></td></tr>
</table>
<p class="fallback-link">Or open this link: <a href="{{ url }}">{{ url }}</a></p>
