name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gitgrit
          POSTGRES_USER: gitgrit
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # Install the EXACT versions recorded in uv.lock. `--locked` makes a
      # pyproject.toml/uv.lock mismatch a hard failure instead of a silent
      # re-resolve, so CI tests the same versions the image ships.
      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key
          GITGRIT_ENCRYPTION_KEY: w258ShlYJUj9-j8a4e7-O_Nnsq8Wgd6LWP-6-ZBFFFQ=
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: gitgrit
          DB_USER: gitgrit
          DB_PASSWORD: testpass
          DEBUG: "True"
        run: uv run --no-sync python manage.py test --settings=gitgrit.settings_test

      # The CLI's API client is generated from cli/openapi.yaml. If the API
      # changed without re-exporting it, the CLI would silently drift from
      # the server: `make -C cli spec` fixes this failure.
      - name: CLI's copy of the OpenAPI spec is current
        env:
          SECRET_KEY: test-secret-key
          GITGRIT_ENCRYPTION_KEY: w258ShlYJUj9-j8a4e7-O_Nnsq8Wgd6LWP-6-ZBFFFQ=
          DEBUG: "True"
        run: |
          uv run --no-sync python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          diff -u cli/openapi.yaml /tmp/openapi.yaml

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Generated client matches openapi.yaml
        run: |
          go generate ./...
          git diff --exit-code -- internal/api/

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Builds for every release platform
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --snapshot --clean
          workdir: cli
        env:
          GITGRIT_CHANNEL: dev

