apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  template:
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/kfirzvi-com/gitgrit-demo-messy-monorepo/api-gateway:latest
          env:
            - name: AUTH_SERVICE_URL
              value: http://auth-service.default.svc.cluster.local:8000
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: gateway-cache, key: url }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector: { app: api-gateway }
  ports: [{ port: 80, targetPort: 3000 }]
